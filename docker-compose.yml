services:
  grok-proxy:
    image: ghcr.io/myflavor/grok-proxy:latest
    container_name: grok-proxy
    restart: unless-stopped
    ports:
      - "5001:8080"          # 宿主机 5001 -> 容器内 8080(与 config.json 的 listen 端口一致)
    environment:
      # 日志时间按本地时区显示; 按 NAS 所在地改, 如 Asia/Shanghai / America/New_York
      - TZ=Asia/Shanghai
      # 可覆盖上游看到的 grok 客户端版本; 默认与 main.go 内置版本一致
      # - GROK_CLIENT_VERSION=1.0.13
    volumes:
      - ./config.json:/app/config.json:ro   # 挂载配置(只读)
      - ./data:/data                          # 凭证持久化(grok-auth.json 存这里)
    # 首次登录: docker compose logs -f grok-proxy 查看授权 URL,浏览器授权后自动完成
